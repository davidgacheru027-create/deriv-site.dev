<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect your Deriv account</title>
  <style>
    :root { color-scheme: light dark; --accent: #e8333f; }
    body {
      margin: 0; padding: 1.25rem;
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { width: 100%; max-width: 24rem; text-align: center; }
    h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 .5rem; }
    p { margin: 0 0 1.25rem; }
    button {
      font: inherit; font-weight: 600;
      width: 100%; padding: .9rem 1.2rem;
      border: 0; border-radius: .6rem;
      background: var(--accent); color: #fff;
    }
    button:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
    button:disabled { opacity: .6; }
    #msg { min-height: 1.5em; margin: 1rem 0 0; font-weight: 600; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Connect your Deriv account</h1>
    <p>You sign in on Deriv. This site never sees your password.</p>
    <button id="login" type="button">Log in with Deriv</button>
    <p id="msg" role="alert"></p>
  </main>

  <script>
    // ===== The only line you must edit: your App ID from the Deriv dashboard =====
    const CLIENT_ID = 'YOUR_CLIENT_ID';
    // ==============================================================================

    const SCOPE = 'trade'; // space-separated, for example 'trade account_manage'
    const $ = (id) => document.getElementById(id);

    function b64url(bytes) {
      let s = '';
      for (const b of bytes) s += String.fromCharCode(b);
      return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    const rand = (n) => b64url(crypto.getRandomValues(new Uint8Array(n)));

    $('login').addEventListener('click', async () => {
      const msg = $('msg');
      msg.textContent = '';

      if (CLIENT_ID === 'YOUR_CLIENT_ID') {
        msg.textContent = 'Replace YOUR_CLIENT_ID in index.html with your Deriv App ID.';
        return;
      }
      if (!window.crypto || !crypto.subtle) {
        msg.textContent = 'Open this site over HTTPS, then try again.';
        return;
      }

      $('login').disabled = true;
      try {
        const verifier = rand(48);   // 64-character PKCE code_verifier
        const state = rand(16);      // random CSRF protection value
        const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
        const redirectUri = location.origin + '/callback';

        // Kept for the callback page. sessionStorage survives the trip to Deriv and back in the same tab.
        sessionStorage.setItem('deriv_oauth', JSON.stringify({
          verifier: verifier,
          state: state,
          clientId: CLIENT_ID,
          redirectUri: redirectUri
        }));

        const params = new URLSearchParams({
          response_type: 'code',
          client_id: CLIENT_ID,
          redirect_uri: redirectUri,
          scope: SCOPE,
          state: state,
          code_challenge: b64url(new Uint8Array(digest)),
          code_challenge_method: 'S256'
        });
        location.assign('https://auth.deriv.com/oauth2/auth?' + params.toString());
      } catch (e) {
        $('login').disabled = false;
        msg.textContent = 'Could not start the login: ' + e.message;
      }
    });
  </script>
</body>
</html>
